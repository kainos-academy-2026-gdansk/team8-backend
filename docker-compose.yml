services:
  db:
    image: postgres:16-alpine
    container_name: team8-backend-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: team8_backend
    ports:
      - "5432:5432"
    networks:
      - internal-network
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d team8_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team8-backend-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/team8_backend
    networks:
      - internal-network
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db_data:

networks:
  internal-network:
    external: true

